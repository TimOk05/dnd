<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест тем</title>
    <style>
        /* Базовые переменные для светлой темы */
        
         :root {
            --bg-primary: #f8f4e8;
            --text-primary: #2d1b00;
            --accent-primary: #a67c52;
            --accent-secondary: #7c4a02;
            --border-primary: #8b4513;
            --shadow-primary: #0002;
        }
        /* Средняя тема */
        
        [data-theme="medium"] {
            --bg-primary: rgba(45, 24, 16, 0.95);
            --text-primary: #f4e4d6;
            --accent-primary: #d2691e;
            --accent-secondary: #b8860b;
            --border-primary: #d2691e;
            --shadow-primary: rgba(210, 105, 30, 0.2);
        }
        /* Темная тема */
        
        [data-theme="dark"] {
            --bg-primary: #050505;
            --text-primary: #e0e0e0;
            --accent-primary: #660000;
            --accent-secondary: #440000;
            --border-primary: #660000;
            --shadow-primary: rgba(102, 0, 0, 0.2);
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .test-btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #f8f4e8;
            border: 3px solid var(--border-primary);
            border-radius: 12px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .test-btn:hover {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            color: #fffbf0;
            transform: translateY(-3px) scale(1.02);
        }
        /* Стили для средней темы */
        
        [data-theme="medium"] .test-btn {
            color: #f4e4d6 !important;
            background: linear-gradient(135deg, #d2691e, #b8860b) !important;
            border: 3px solid #d2691e !important;
        }
        
        [data-theme="medium"] .test-btn:hover {
            color: #f4e4d6 !important;
            background: linear-gradient(135deg, #ff8c00, #d2691e) !important;
        }
        /* Стили для темной темы */
        
        [data-theme="dark"] .test-btn {
            color: #ffe6e6 !important;
            background: linear-gradient(135deg, #660000, #440000) !important;
            border: 3px solid #660000 !important;
        }
        
        [data-theme="dark"] .test-btn:hover {
            color: #ffe6e6 !important;
            background: linear-gradient(135deg, #880000, #660000) !important;
        }
        
        .theme-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>Тест тем</h1>

    <div class="theme-info">
        <p>Текущая тема: <span id="current-theme">light</span></p>
        <p>Атрибут data-theme: <span id="data-theme-attr">light</span></p>
    </div>

    <button onclick="switchTheme()">Переключить тему</button>

    <div>
        <button class="test-btn">Тестовая кнопка</button>
    </div>

    <script>
        let currentTheme = 'light';
        const themes = ['light', 'medium', 'dark'];

        function switchTheme() {
            const currentIndex = themes.indexOf(currentTheme);
            const nextIndex = (currentIndex + 1) % themes.length;
            currentTheme = themes[nextIndex];

            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('current-theme').textContent = currentTheme;
            document.getElementById('data-theme-attr').textContent = document.documentElement.getAttribute('data-theme');
        }

        // Инициализация
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('data-theme-attr').textContent = document.documentElement.getAttribute('data-theme');
    </script>
</body>

</html>
